[package]
name = "unicorn-rewrite"
version = "0.1.0"
description = "Corriger et reformuler le texte sélectionné, depuis la barre de menu"
authors = ["Digital Unicorn"]
license = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Mode d'auto-test : pilote de vraies apps macOS (TextEdit, Safari, Chrome)
# avec un fournisseur IA simulé. Jamais compilé dans un build de distribution.
selftest = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
thiserror = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "libc",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "NSAnimation",
    "NSAnimationContext",
    "NSGlassEffectView",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSWorkspace",
    "NSSound",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSArray", "NSData", "NSDictionary", "NSEnumerator"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CAMediaTimingFunction"] }
core-foundation = "0.10"
security-framework = "3"
plist = "1"
